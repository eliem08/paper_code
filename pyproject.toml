[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "breastpath-copilot"
version = "0.1.0"
description = "Uncertainty-aware MoE diagnostic engine with MCP agentic decision support for breast histopathology"
authors = [{name = "Anonymous (for review)"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16.0",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "typer>=0.12",
  "rich>=13.7",
  "Pillow>=10.4",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
fm = [
  "torch>=2.2",
  "torchvision>=0.17",
  "timm>=1.0.9",
  "transformers>=4.44",
  "huggingface_hub>=0.24",
]
mcp = ["mcp>=1.0"]
agents = ["openai>=1.40"]

[project.scripts]
breastpath-mcp = "breastpath_copilot.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
